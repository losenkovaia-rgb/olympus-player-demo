<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OLYMPUS">
  <title>OLYMPUS</title>
  <link rel="icon" type="image/png" href="./olympus-app-icon.png">
  <link rel="apple-touch-icon" href="./olympus-app-icon.png">
  <link rel="manifest" href="./app.webmanifest">
  <style>
    :root{color-scheme:dark;--bg:#08101d;--gold:#d8ad4a;--text:#eef4ff;--muted:#91a0b8}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
    .splash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#17243a 0,#08101d 64%);transition:opacity .25s ease}
    .splash.hide{opacity:0;pointer-events:none}
    .brand{text-align:center;padding:28px}
    .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 16px 50px rgba(0,0,0,.38);display:block;margin:0 auto 18px}
    .name{font-size:26px;font-weight:900;letter-spacing:.16em;color:#f3d889}
    .sub{margin-top:8px;color:var(--muted);font-size:13px}
    .setup{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px}
    .setup.show{display:flex}
    .card{width:min(520px,100%);background:#121c2e;border:1px solid #263754;border-radius:22px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .card h1{margin:0 0 8px;font-size:24px;color:#f3d889}
    .card p{margin:0 0 16px;color:#b5c0d2;line-height:1.45}
    .card input{width:100%;border:1px solid #334968;border-radius:12px;background:#0b1423;color:#fff;padding:13px 14px;font-size:15px;outline:none}
    .card button{width:100%;margin-top:12px;border:0;border-radius:12px;background:#d8ad4a;color:#101827;font-weight:800;padding:13px 14px;font-size:16px}
    .err{display:none;margin-top:10px;color:#ff9e98;font-size:13px}
    .open{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;border:1px solid rgba(216,173,74,.45);background:rgba(8,16,29,.82);color:#f3d889;border-radius:999px;padding:9px 12px;font-size:12px;text-decoration:none;backdrop-filter:blur(10px)}
  </style>
</head>
<body>
  <iframe id="frame" allow="clipboard-read; clipboard-write"></iframe>
  <a id="openExternal" class="open" href="#" target="_blank" rel="noopener">Открыть напрямую</a>

  <div id="splash" class="splash">
    <div class="brand">
      <img class="logo" src="./olympus-app-icon.png" alt="OLYMPUS">
      <div class="name">OLYMPUS</div>
      <div class="sub">Player Dashboard</div>
    </div>
  </div>

  <div id="setup" class="setup">
    <div class="card">
      <h1>OLYMPUS</h1>
      <p>Вставьте действующую ссылку Player App один раз. Она сохранится только на этом устройстве.</p>
      <input id="urlInput" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="saveBtn">Подключить ЛК</button>
      <div id="err" class="err">Нужна ссылка Apps Script Web App, заканчивающаяся на /exec.</div>
    </div>
  </div>

<script>
(function(){
  var KEY='olympus_player_app_url';
  var q=new URLSearchParams(location.search);
  var incoming=(q.get('target')||'').trim();
  var saved='';
  try{saved=localStorage.getItem(KEY)||'';}catch(e){}
  var target=incoming||saved;

  function valid(u){
    return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/i.test(String(u||'').trim());
  }
  function launch(u){
    if(!valid(u)) return false;
    try{localStorage.setItem(KEY,u);}catch(e){}
    document.getElementById('frame').src=u;
    document.getElementById('openExternal').href=u;
    document.getElementById('setup').classList.remove('show');
    setTimeout(function(){document.getElementById('splash').classList.add('hide');},500);
    return true;
  }
  if(!launch(target)){
    document.getElementById('splash').classList.add('hide');
    document.getElementById('setup').classList.add('show');
  }
  document.getElementById('saveBtn').addEventListener('click',function(){
    var u=document.getElementById('urlInput').value.trim();
    if(!launch(u)) document.getElementById('err').style.display='block';
  });
  document.getElementById('urlInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') document.getElementById('saveBtn').click();
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
